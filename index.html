/* Larger, thumb-friendly shopping checklist */
.grocery-group .grocery-row{
  display:flex;
  align-items:center;
  gap:14px;
  min-height:58px;
  width:100%;
  box-sizing:border-box;
  padding:10px 12px;
  margin:7px 0;
  background:#fff;
  border:1px solid #e5ebe1 !important;
  border-radius:15px;
  cursor:pointer;
}
.grocery-group .grocery-row input[type="checkbox"]{
  appearance:none;
  -webkit-appearance:none;
  flex:0 0 28px;
  width:28px;
  height:28px;
  min-width:28px;
  border:2px solid #aebbaa;
  border-radius:8px;
  background:#fff;
  position:relative;
  cursor:pointer;
  margin:0;
}
.grocery-group .grocery-row input[type="checkbox"]:checked{
  background:#6f8f68;
  border-color:#6f8f68;
}
.grocery-group .grocery-row input[type="checkbox"]:checked::after{
  content:"✓";
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-54%);
  color:#fff;
  font-size:19px;
  font-weight:800;
}
.grocery-group .grocery-row span{
  font-size:15px;
  font-weight:600;
  line-height:1.3;
}
.grocery-group .grocery-row:has(input:checked){
  opacity:.58;
}
.grocery-group .grocery-row:has(input:checked) span{
  text-decoration:line-through;
}


.pantry-card{margin-top:8px}

function recipeById(id){return nourishRecipes.find(r=>r.id===id)}
function mealTitle(meal){
  if(meal.type==='recipe')return recipeById(meal.id)?.name||'Planned dinner';
  if(meal.type==='leftover')return `Leftover ${recipeById(meal.from)?.name||'meal'}`;
  if(meal.type==='leftoverDinner')return `Leftover ${recipeById(meal.from)?.name||'meal'}`;
  if(meal.type==='quick')return quickLunches[meal.key]?.name||'Easy lunch';
  return 'Flexible meal';
}
function mealDetailText(meal){
  if(meal.type==='recipe')return `Makes ${recipeById(meal.id).servings} servings — Nourish plans the extra portions as leftovers.`;
  if(meal.type==='leftover'||meal.type==='leftoverDinner')return 'Use a portion already cooked earlier in the week — no extra cooking or shopping needed.';
  return quickLunches[meal.key]?.detail||'';
}
function mealIngredients(meal){
  if(meal.type==='recipe')return recipeById(meal.id)?.ingredients||[];
  if(meal.type==='quick')return quickLunches[meal.key]?.ingredients||[];
  return [];
}
function formatQty(amount,unit){
  if(unit==='')return String(amount);
  return `${amount} ${unit}`;
}
function addIngredient(counts,[name,amount,unit,group]){
  const key=name.toLowerCase();
  if(!counts[key])counts[key]={name,amount,unit,group};
  else if(counts[key].unit===unit)counts[key].amount+=amount;
  else counts[key].qty=(counts[key].qty||formatQty(counts[key].amount,counts[key].unit))+' + '+formatQty(amount,unit);
}

function loadHomeGroceries(){
  try{
    const saved=JSON.parse(storageGet('nourishHomeGroceries','[]')||'[]');
    if(Array.isArray(saved)) homeGroceries=saved;
  }catch(e){homeGroceries=[];}
}
loadHomeGroceries();
function loadWater(){
  try{
    const savedDate=storageGet("nourishWaterDate");
    const today=new Date().toISOString().slice(0,10);
    water=savedDate===today ? Number(storageGet("nourishWater","0")||0) : 0;
  }catch(e){ water=0; }
}
function saveWater(){
  try{
    storageSet("nourishWaterDate",new Date().toISOString().slice(0,10));
    storageSet("nourishWater",String(water));
  }catch(e){}
}

function saveMealPlan(){
  storageSet('nourishMealPlan',JSON.stringify(mealPlan));
}
function loadMealPlan(){
  try{
    const saved=JSON.parse(storageGet('nourishMealPlan','null')||'null');
    if(Array.isArray(saved)&&saved.length===7){mealPlan=saved;}
  }catch(e){}
  selectedMealPlan=mealPlan.map(x=>x.din.type==='recipe'?x.din.id:null).filter(Boolean);
}
loadMealPlan();

function nav(){document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===page))}
function render(){
nav();
if(page==="home") renderHome();
if(page==="meals") renderMeals();
if(page==="groceries") renderGroceries();
if(page==="move") renderMove();
if(page==="water") renderWater();
}
function renderHome(){
let m=mealPlan[selectedDay], dinner=m.din, dinnerRecipe=dinner.type==='recipe'?recipeById(dinner.id):null;
let lunchTitle=mealTitle(m.l), dinnerTitle=mealTitle(dinner);
app.innerHTML=`
<div class="card hero"><div class="small">${m.d.toUpperCase()} • YOUR PLAN IS FLEXIBLE</div><h2>Good morning ☀️</h2><p>Nourish handles the thinking. You just choose what fits today.</p></div>
<div class="card"><div class="row"><div><div class="small">TODAY'S LUNCH</div><div class="big">${esc(lunchTitle)}</div></div><div class="icon">🥗</div></div><p>${esc(mealDetailText(m.l))}</p>${m.l.type==='leftover'?'<span class="tag">♻️ Leftover first</span>':''}</div>
<div class="card"><div class="row"><div><div class="small">TONIGHT'S DINNER</div><div class="big">${esc(dinnerTitle)}</div></div><div class="icon">🍽️</div></div><p>${esc(mealDetailText(dinner))}</p><div>${dinnerRecipe?`<span class="tag">⏱ ${dinnerRecipe.mins} min</span><span class="tag">⭐ ${dinnerRecipe.score}/10 whole-food</span><span class="tag">🍽️ ${dinnerRecipe.servings} servings</span>`:'<span class="tag">♻️ No extra cooking</span>'}</div><button class="secondary" style="margin-top:10px" onclick="mealDetail(${selectedDay})">View meal</button></div>
<div class="card"><div class="row"><div><div class="small">TODAY'S MOVE</div><div class="big">15-minute workout</div><p>Picked from your library</p></div><div class="icon">🏋️</div></div><button onclick="page='move';render()">Start workout</button></div>
<div class="grid"><div class="card mini"><div class="icon">💧</div><div class="big">${(water/1000).toFixed(2)} L</div><div class="small">of ${(goal/1000).toFixed(1)} L</div><div class="progress"><span style="width:${Math.min(100,water/goal*100)}%"></span></div><button class="secondary" onclick="addWater(250)">+250 ml</button></div>
<div class="card mini"><div class="icon">🛒</div><div class="big">${countGroceryItems()} items</div><div class="small">from this week's plan</div><button class="secondary" onclick="page='groceries';render()">Shop list</button></div></div>
<div class="card"><div class="row"><div><div class="small">LEFTOVERS</div><div class="big">Cook once, use twice</div></div><span class="icon">♻️</span></div><p>${leftoverSummary()}</p></div>`;
}
function countGroceryItems(){
 const pantryItems=new Set(JSON.parse(storageGet('nourishPantryItems','[]')||'[]').map(x=>String(x).toLowerCase()));
 const counts={};
 mealPlan.forEach(day=>{[day.l,day.din].forEach(meal=>mealIngredients(meal).forEach(i=>{if(!pantryItems.has(i[0].toLowerCase()))counts[i[0].toLowerCase()]=1;}));});
 return Object.keys(counts).length;
}
function leftoverSummary(){
 const names=mealPlan.filter(x=>x.l.type==='leftover').map(x=>x.l.from).map(id=>recipeById(id)?.name).filter(Boolean);
 return names.length?`Leftovers are built into ${names.length} lunches this week, so you are not cooking from scratch every day.`:'This plan uses leftovers where possible to reduce cooking and food waste.';
}
function dayTabs(){
return `<div class="daytabs">${mealPlan.map((m,i)=>`<button class="day ${i===selectedDay?'active':''}" onclick="selectedDay=${i};render()">${m.d}<br><b>${i+1}</b></button>`).join("")}</div>`
}
function renderMeals(){
let m=mealPlan[selectedDay], dinner=m.din, lunch=m.l, dinnerRecipe=dinner.type==='recipe'?recipeById(dinner.id):null;
app.innerHTML=`<h2>Meal plan</h2><p>Seven flexible days. Lunch + dinner + simple snacks — with leftovers deliberately built in.</p>${dayTabs()}
<div class="card"><div class="small">${m.d.toUpperCase()} • LUNCH</div><h2>${esc(mealTitle(lunch))}</h2><p>${esc(mealDetailText(lunch))}</p><div>${lunch.type==='leftover'?'<span class="tag">♻️ Uses leftovers</span>':'<span class="tag">⚡ Easy lunch</span>'}</div><button class="secondary" style="margin-top:10px" onclick="mealDetail(${selectedDay},'lunch')">View</button></div>
<div class="card"><div class="small">${m.d.toUpperCase()} • DINNER</div><h2>${esc(mealTitle(dinner))}</h2><p>${esc(mealDetailText(dinner))}</p><div>${dinnerRecipe?`<span class="tag">⏱ ${dinnerRecipe.mins} min</span><span class="tag">⭐ ${dinnerRecipe.score}/10 whole-food</span><span class="tag">🍽️ ${dinnerRecipe.servings} servings</span>`:'<span class="tag">♻️ Leftovers — no cooking</span>'}</div><button style="margin-top:12px" onclick="mealDetail(${selectedDay},'dinner')">${dinnerRecipe?'Open recipe':'View meal'}</button> <button class="secondary" onclick="swapMeal()">Swap dinner</button></div>
<div class="card"><div class="small">SNACK</div><div class="big">${esc(m.s)}</div><p>Choose one or two depending on hunger.</p></div>
<div class="card notice"><b>Leftover logic</b><p style="margin:6px 0 0">Cooked recipes make 4 servings. Dinner uses 2 and the remaining 2 are automatically reserved for a future meal.</p></div>
<div class="card"><button class="secondary" onclick="resetPlan()">↺ Reset this week</button></div>`;
}
function mealDetail(i,which='dinner'){
let m=mealPlan[i], meal=which==='lunch'?m.l:m.din;
if(meal.type==='leftover'||meal.type==='leftoverDinner'){
  const source=recipeById(meal.from);
  document.getElementById("modalBody").innerHTML=`<div class="small">${m.d.toUpperCase()} • ${which.toUpperCase()}</div><h2>${esc(mealTitle(meal))}</h2><p>${esc(mealDetailText(meal))}</p><div class="info-card"><div class="info-icon">♻️</div><div><b>No extra shopping</b><div class="muted">This meal is already accounted for in the ${source?.servings||4}-serving recipe cooked on the earlier day.</div></div></div><button onclick="closeModal()">Done</button>`;
  openModal();return;
}
const ingredients=mealIngredients(meal);
document.getElementById("modalBody").innerHTML=`<div class="small">${m.d.toUpperCase()} • ${which.toUpperCase()}</div><h2>${esc(mealTitle(meal))}</h2><p>${esc(mealDetailText(meal))}</p><h3>Ingredients</h3><ul>${ingredients.map(([name,amount,unit])=>`<li>${esc(formatQty(amount,unit))} ${esc(name)}</li>`).join("")}</ul>${meal.type==='recipe'?'<div class="info-card"><div class="info-icon">♻️</div><div><b>Cook 4 servings</b><div class="muted">Two servings are for tonight and the remaining two are reserved for leftovers in your plan.</div></div></div>':''}<button onclick="closeModal()">Done</button>`;
openModal();
}
function swapMeal(){
 const current=mealPlan[selectedDay].din;
 const used=new Set(mealPlan.map(x=>x.din.id).filter(Boolean));
 const candidates=nourishRecipes.filter(r=>r.id!==current.id && !used.has(r.id));
 const next=candidates[0]||nourishRecipes.find(r=>r.id!==current.id);
 mealPlan[selectedDay].din={type:'recipe',id:next.id};
 // If the next day's lunch was tied to the old recipe, point it to the new leftovers.
 if(selectedDay<mealPlan.length-1 && mealPlan[selectedDay+1].l.type==='leftover' && mealPlan[selectedDay+1].l.from===current.id){mealPlan[selectedDay+1].l.from=next.id;}
 saveMealPlan();selectedMealPlan=mealPlan.map(x=>x.din.type==='recipe'?x.din.id:null).filter(Boolean);render();toast(`${next.name} added — grocery list updated.`);
}
function resetPlan(){storageRemove('nourishMealPlan');resetMealPlan();saveMealPlan();selectedDay=0;selectedMealPlan=mealPlan.map(x=>x.din.type==='recipe'?x.din.id:null).filter(Boolean);render();toast("This week's plan has been reset.");}
function esc(s){
  return String(s).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function saveHomeGroceries(){
  storageSet('nourishHomeGroceries',JSON.stringify(homeGroceries));
}
function toggleHomeGrocery(id){
  const item=homeGroceries.find(x=>x.id===id);
  if(item){item.checked=!item.checked;saveHomeGroceries();renderGroceries();}
}
function deleteHomeGrocery(id){
  homeGroceries=homeGroceries.filter(x=>x.id!==id);
  saveHomeGroceries();renderGroceries();
}
function clearBoughtHomeGroceries(){
  homeGroceries=homeGroceries.filter(x=>!x.checked);
  saveHomeGroceries();renderGroceries();
}
document.addEventListener('keydown',function(e){if(e.key==='Enter'&&document.getElementById('homeItemInput')) addHomeGrocery();});
function addHomeGrocery(){
  const name=(document.getElementById('homeItemInput')?.value||'').trim();
  if(!name){alert('Please enter an item.');return;}
  const recurring=document.getElementById('homeRecurring')?.checked||false;
  const frequency=document.getElementById('homeFrequency')?.value||'';
  homeGroceries.push({
    id:Date.now(),
    name:name,
    checked:false,
    recurring:recurring,
    frequency:frequency
  });
  saveHomeGroceries();
  closeModal();
  renderGroceries();
}
function openHomeGroceryModal(){
  openModal(`
    <div class="modal-head"><div><div class="eyebrow">HOME & HOUSEHOLD</div><h2>Add an item</h2></div><button class="icon-btn" onclick="closeModal()">×</button></div>
    <div class="form-stack">
      <label class="field-label">What do you need?</label>
      <input id="homeItemInput" class="text-input" placeholder="e.g. toothpaste, laundry detergent, milk" autofocus>
      <label class="check-row"><input type="checkbox" id="homeRecurring"> <span>Remind me to buy this regularly</span></label>
      <select id="homeFrequency" class="text-input">
        <option value="">Choose frequency</option>
        <option>Weekly</option>
        <option>Fortnightly</option>
        <option>Monthly</option>
        <option>Every 8 weeks</option>
      </select>
      <button class="primary-btn" onclick="addHomeGrocery()">Add to home list</button>
    </div>
  `);
}

function togglePantryItem(name,checked){
  let items=JSON.parse(storageGet('nourishPantryItems','[]')||'[]');
  if(checked && !items.includes(name))items.push(name);
  if(!checked)items=items.filter(x=>x!==name);
  storageSet('nourishPantryItems',JSON.stringify(items));
  renderGroceries();
}
function renderGroceries(){
  const pantryItems=new Set(JSON.parse(storageGet('nourishPantryItems','[]')||'[]').map(x=>String(x).toLowerCase()));
  const counts={};
  const addIfNeeded=(ingredient)=>{
    const [name]=ingredient;
    if(String(name).toLowerCase()==='cooked chicken')return;
    if(pantryItems.has(String(name).toLowerCase()))return;
    addIngredient(counts,ingredient);
  };
  mealPlan.forEach(day=>{
    if(day.din.type==='recipe')mealIngredients(day.din).forEach(addIfNeeded);
    if(day.l.type==='quick')mealIngredients(day.l).forEach(addIfNeeded);
    (snackIngredients[day.s]||[]).forEach(addIfNeeded);
  });

  const groups={Protein:[],Produce:[],Pantry:[]};
  Object.values(counts).sort((a,b)=>(['Protein','Produce','Pantry'].indexOf(a.group)-['Protein','Produce','Pantry'].indexOf(b.group))||a.name.localeCompare(b.name)).forEach(x=>groups[x.group].push(x));
  const cookingSessions=mealPlan.filter(x=>x.din.type==='recipe').length;
  const leftoverMeals=mealPlan.filter(x=>x.l.type==='leftover'||x.din.type==='leftoverDinner').length;

  let out=`<div class="section-title-row"><div><div class="eyebrow">THIS WEEK</div><h2>Shopping list</h2></div><div class="pill">${Object.keys(counts).length} food</div></div>`;
  out+=`<div class="info-card"><div class="info-icon">🧾</div><div><b>Built from your actual meal plan</b><div class="muted">${cookingSessions} cooking sessions · ${leftoverMeals} leftover meals · snacks included. Change a meal and this list changes too.</div></div></div>`;
  Object.keys(groups).forEach(g=>{
    if(!groups[g].length)return;
    out+=`<div class="grocery-group"><h3>${g}</h3>`;
    groups[g].forEach(x=>{
      const qty=x.qty||formatQty(x.amount,x.unit);
      out+=`<label class="grocery-row"><input type="checkbox"><span><b>${esc(qty)}</b> ${esc(x.name)}</span></label>`;
    });
    out+=`</div>`;
  });
  out+=`<div class="info-card pantry-card"><div class="info-icon">🏡</div><div><b>Already have pantry staples?</b><div class="muted">Mark items you already have so Nourish won't add them to future shopping lists.</div><div class="pantry-chips">`;
  ['Rice','Soy sauce','Olive oil','Oats','Chia seeds','Nuts'].forEach(item=>{
    const checked=pantryItems.has(item.toLowerCase());
    out+=`<label class="pantry-chip"><input type="checkbox" ${checked?'checked':''} onchange="togglePantryItem('${item}',this.checked)"><span>${item}</span></label>`;
  });
  out+=`</div></div></div>`;
  out+=`<div class="grocery-group home-group"><div class="section-title-row"><div><h3>🏠 Home & household</h3><div class="muted">Things you need around the house</div></div><button class="small-btn" onclick="openHomeGroceryModal()">＋ Add</button></div>`;
  if(homeGroceries.length===0){
    out+=`<div class="empty-state"><div class="empty-icon">🏠</div><b>No household items yet</b><div class="muted">Add toothpaste, laundry detergent, toilet paper, milk or anything else you need.</div><button class="secondary-btn" onclick="openHomeGroceryModal()">＋ Add household item</button></div>`;
  } else {
    const bought=homeGroceries.filter(x=>x.checked).length;
    homeGroceries.forEach(item=>{
      out+=`<div class="home-item ${item.checked?'done':''}"><label class="grocery-row home-row"><input type="checkbox" ${item.checked?'checked':''} onchange="toggleHomeGrocery(${item.id})"><span>${esc(item.name)}</span></label><div class="home-actions">${item.recurring&&item.frequency?`<span class="recurring">↻ ${esc(item.frequency)}</span>`:''}<button class="delete-btn" onclick="deleteHomeGrocery(${item.id})" aria-label="Delete">×</button></div></div>`;
    });
    if(bought)out+=`<button class="text-btn" onclick="clearBoughtHomeGroceries()">Clear ${bought} bought item${bought===1?'':'s'}</button>`;
  }
  out+=`</div><div class="list-summary"><span>${Object.keys(counts).length} food items from plan</span><span>${homeGroceries.length} home item${homeGroceries.length===1?'':'s'}</span></div>`;
  document.getElementById('app').innerHTML=out;
}

function uncheckAll(){document.querySelectorAll(".gro").forEach(x=>x.checked=false)}
function addGroceries(){closeModal();page="groceries";render();toast("Ingredients added to this week's grocery list.");}
function renderMove(){
app.innerHTML=`<h2>Move 🏋️</h2><p>Your personal workout library. No searching required.</p>
<div class="chips"><span class="chip active">15 min</span><span class="chip">Full body</span><span class="chip">Low impact</span><span class="chip">No equipment</span></div>
<div class="card hero"><div class="small">WHAT DO YOU FEEL LIKE?</div><h2>Choose for me ✨</h2><p>Nourish will pick from your saved workouts.</p><button onclick="chooseWorkout()">Pick today's workout</button></div>
${workouts.map((w,i)=>`<div class="card"><div class="workout"><div class="thumb">▶</div><div style="flex:1"><div class="big">${w[0]}</div><div class="small">${w[1]} · ${w[2]} · ${w[3]}</div></div></div><button class="secondary" style="margin-top:10px" onclick="openWorkout(${i})">Open on YouTube</button> <button class="ghost" onclick="completeWorkout(${i})">${completed.has(i)?"✓ Completed":"Mark done"}</button></div>`).join("")}`;
}
function chooseWorkout(){let i=Math.floor(Math.random()*workouts.length);openWorkout(i)}
function openWorkout(i){
let w=workouts[i];
document.getElementById("modalBody").innerHTML=`<div class="small">YOUR WORKOUT LIBRARY</div><h2>${w[0]}</h2><p>${w[1]} · ${w[2]} · ${w[3]}</p><div class="card"><div class="big">Ready?</div><p>Open the workout directly on YouTube, then come back and mark it complete.</p></div><button onclick="window.open('${w[4]}','_blank')">▶ Open on YouTube</button><button class="secondary" style="margin-left:6px" onclick="completeWorkout(${i});closeModal()">✓ Done</button>`;
openModal();
}
function completeWorkout(i){completed.add(i);toast("Workout marked complete.");render();}
function renderWater(){
let pct=Math.min(100,water/goal*100);
app.innerHTML=`<h2>Water 💧</h2><p>Keep it effortless — one tap at a time.</p>
<div class="card hero" style="text-align:center"><div style="font-size:48px">💧</div><div style="font-size:36px;font-weight:750">${(water/1000).toFixed(2)} L</div><p>Daily goal ${(goal/1000).toFixed(1)} L</p><div class="progress"><span style="width:${pct}%"></span></div><div class="grid"><button onclick="addWater(250)">+250 ml</button><button onclick="addWater(500)">+500 ml</button></div></div>
<div class="card"><div class="small">QUICK ADD</div><div class="grid" style="margin-top:10px"><button class="secondary" onclick="addWater(350)">350 ml</button><button class="secondary" onclick="addWater(750)">750 ml</button></div></div>
<div class="card"><div class="row"><div><div class="big">No guilt, no streaks</div><p>Nourish shows your progress without making hydration another task to manage.</p></div><span class="icon">🌿</span></div></div>`;
}
function addWater(n){water=Math.min(water+n,5000);saveWater();render();toast(`+${n} ml added`)}
function openModal(){document.getElementById("modal").style.display="flex"}
function closeModal(){document.getElementById("modal").style.display="none"}
function toast(msg){let t=document.createElement("div");t.textContent=msg;t.style="position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#27342e;color:#fff;padding:11px 15px;border-radius:99px;font-size:13px;z-index:50";document.body.appendChild(t);setTimeout(()=>t.remove(),1800)}
function openPage(target){
  page=target;
  render();
  window.scrollTo(0,0);
}
loadWater();
try{render();}catch(error){
  console.error(error);
  app.innerHTML=`<div class="card hero"><h2>Welcome to Nourish 🌿</h2><p>The app loaded, but your browser blocked one of its optional features. Please refresh this page. Your meal plan will still work without saved browser data.</p><button onclick="location.reload()">Refresh Nourish</button></div>`;
}
</script>
</body>
</html>
